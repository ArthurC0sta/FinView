name: Open pull request

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pull-request:
    name: Open pull request
    runs-on: ubuntu-latest

    steps:
      - name: Check for an existing pull request
        id: existing-pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          count="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --state open \
              --json number \
              --jq 'length'
          )"

          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.existing-pr.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "Auto PR: $BRANCH" \
            --body "PR aberto automaticamente após o push do commit \`$COMMIT_SHA\` para a branch \`$BRANCH\`."
