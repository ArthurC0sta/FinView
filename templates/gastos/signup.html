{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Criar conta — FinView AI</title>
<meta name="description" content="Cadastre-se no FinView AI." />
<link rel="stylesheet" href="{% static 'assets/css/styles.css' %}" />
</head>
<body>
<div class="bg-anim subtle"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div><div class="bg-grid"></div>

<main style="min-height:100vh;display:grid;place-items:center;padding:2rem 1rem">
  <div style="width:100%;max-width:480px">
    <div class="text-center mb-6"><a href="{% url 'gastos:landing' %}" class="logo"><span class="dot">F</span><span>FinView <span class="text-gradient">AI</span></span></a></div>
    <div class="glass-strong" style="padding:2rem">
      <h1 class="font-display text-2xl font-bold text-center">Crie sua conta</h1>
      <p class="text-sm muted text-center mt-2">Vamos personalizar a IA para você</p>
      <form action="{% url 'gastos:signup' %}" method="post" style="margin-top:1.5rem">
        {% csrf_token %}
        <label class="label">Nome completo</label>
        <input class="input" name="name" placeholder="Seu nome" autocomplete="name" autofocus required />
        <label class="label mt-4">E-mail</label>
        <input class="input" name="email" type="email" placeholder="voce@email.com" autocomplete="email" autocapitalize="none" spellcheck="false" required />
        <label class="label mt-4">Senha</label>
        <input class="input" name="password" type="password" placeholder="••••••••" autocomplete="new-password" minlength="6" required />
        <label class="label mt-4">Objetivo financeiro principal</label>
        <p class="text-xs muted mt-2" style="margin-bottom:.6rem">Essa informação será usada pela IA para analisar seus gastos conforme sua meta.</p>
        <input id="goal-input" name="goal" type="hidden" value="Economizar dinheiro" />
        <div class="grid g2" id="goals" style="gap:.5rem"><button type="button" class="goal-opt" data-goal="Economizar dinheiro" style="padding:.8rem;border-radius:.75rem;border:1px solid hsl(0 0% 100% / .10);background:hsl(0 0% 100% / .04);text-align:left;font-size:.85rem;display:flex;align-items:center;gap:.5rem"><span>🐷</span>Economizar dinheiro</button><button type="button" class="goal-opt" data-goal="Reduzir dívidas" style="padding:.8rem;border-radius:.75rem;border:1px solid hsl(0 0% 100% / .10);background:hsl(0 0% 100% / .04);text-align:left;font-size:.85rem;display:flex;align-items:center;gap:.5rem"><span>📉</span>Reduzir dívidas</button><button type="button" class="goal-opt" data-goal="Controlar gastos" style="padding:.8rem;border-radius:.75rem;border:1px solid hsl(0 0% 100% / .10);background:hsl(0 0% 100% / .04);text-align:left;font-size:.85rem;display:flex;align-items:center;gap:.5rem"><span>👛</span>Controlar gastos</button><button type="button" class="goal-opt" data-goal="Investir melhor" style="padding:.8rem;border-radius:.75rem;border:1px solid hsl(0 0% 100% / .10);background:hsl(0 0% 100% / .04);text-align:left;font-size:.85rem;display:flex;align-items:center;gap:.5rem"><span>📈</span>Investir melhor</button></div>
        <button type="submit" class="btn btn-primary mt-6" style="width:100%">Criar conta →</button>
      </form>
      <p class="text-sm muted text-center mt-6">Já tem conta? <a href="{% url 'gastos:login' %}" style="color:hsl(var(--primary));font-weight:500">Entrar</a></p>
    </div>
  </div>
</main>
<script>
  const opts=document.querySelectorAll('.goal-opt');let active=opts[0];if(active){active.style.borderColor='hsl(var(--primary))';active.style.background='hsl(var(--primary) / .12)'}
  const goalInput=document.querySelector('#goal-input');
  opts.forEach(o=>o.addEventListener('click',()=>{if(active){active.style.borderColor='hsl(0 0% 100% / .10)';active.style.background='hsl(0 0% 100% / .04)'}active=o;o.style.borderColor='hsl(var(--primary))';o.style.background='hsl(var(--primary) / .12)';if(goalInput){goalInput.value=o.dataset.goal || o.textContent.trim()}}));
</script>
<script src="{% static 'assets/js/app.js' %}?v=20260501-money-mask"></script>
</body></html>
