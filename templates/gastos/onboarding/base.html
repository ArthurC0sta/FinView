{% extends 'gastos/base.html' %}
{% block body_class %}product-body onboarding-body{% endblock %}
{% block body %}<a class="skip-link" href="#onboarding-content">Ir para o conteúdo</a><header class="onboarding-header"><a href="{% url 'gastos:landing' %}" class="auth-brand"><span>F</span>FinView</a><p>Configuração empresarial</p></header><main class="onboarding-shell" id="onboarding-content"><nav class="onboarding-progress" aria-label="Progresso da configuração">{% for number in '1234' %}<span class="{% if onboarding_step >= forloop.counter %}active{% endif %}" {% if onboarding_step == forloop.counter %}aria-current="step"{% endif %}>{{ forloop.counter }}</span>{% endfor %}</nav><section class="onboarding-card">{% block onboarding_content %}{% endblock %}</section></main>{% endblock %}
