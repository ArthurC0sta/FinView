<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova despesa — FinView AI</title><link rel="stylesheet" href="assets/styles.css"></head><body>
