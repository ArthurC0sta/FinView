<button id="aiToggle" class="ai-toggle" aria-label="Abrir análise consultiva" aria-controls="aiPanel" aria-expanded="false"><i class="ph ph-sparkle"></i><span>Analisar</span></button>

<aside id="aiPanel" class="ai-panel" aria-hidden="true" data-ai-url="{% url 'gastos:ai_financial_insight' %}" data-month="{{ current_month_input }}" data-csrf="{{ csrf_token }}">
  <button id="aiClose" class="close-x" aria-label="Fechar análise"><i class="ph ph-x"></i></button>

  <div class="ai-panel-header">
    <div class="ai-panel-icon"><i class="ph ph-sparkle"></i></div>
    <div>
      <p class="section-kicker">Análise consultiva</p>
      <h2>Leitura do período</h2>
    </div>
  </div>

  <div class="ai-card tip">
    <p class="ai-card-label"><i class="ph ph-brain"></i> Explicação gerada por IA</p>
    <div id="aiInsightText" class="text-sm mt-2" aria-live="polite">Preparando a leitura dos seus lançamentos.</div>
  </div>
  <div class="ai-card goal"><p class="ai-card-label"><i class="ph ph-target"></i> Objetivo informado</p><p class="text-sm mt-2">{{ current_user.goal|default:'Controlar gastos' }}.</p></div>

  <p class="ai-disclaimer"><i class="ph ph-info"></i> Esta análise é gerencial e consultiva. Não substitui contador habilitado.</p>
</aside>
