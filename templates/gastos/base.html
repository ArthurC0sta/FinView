{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FinView AI{% endblock %}</title>
  <meta name="description" content="{% block description %}FinView AI{% endblock %}">
  <link rel="stylesheet" href="{% static 'assets/css/styles.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/product.css' %}?v=20260925-business-core">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
